<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CampusMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Campus<span>Market</span></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </nav>
    <a href="catalog.html" class="btn btn-lime">Sell an item</a>
  </header>

  <main>
    <section class="form-section">
      <h1>Create your account</h1>
      <p>Register with your campus email to start buying and selling.</p>

      <form id="register-form" novalidate>

        <div class="form-group">
          <label for="fullname">Full name</label>
          <input type="text" id="fullname" name="fullname">
          <span class="error-message" id="fullname-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Campus email</label>
          <input type="text" id="email" name="email" placeholder="you@campus.ac.ke">
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password">
          <span class="error-message" id="password-error"></span>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password">
          <span class="error-message" id="confirm-password-error"></span>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="show-password">
          <label for="show-password">Show password</label>
        </div>

        <button type="submit" class="btn btn-lime">Create account</button>

        <p class="form-success" id="form-success"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Campus Market. Built by students, for students.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
